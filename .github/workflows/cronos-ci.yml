name: CRONOS Logic Guard

on:
  push:
    branches:
      - main

jobs:
  cronos_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Send code to CRONOS
        run: |
          curl -X POST https://final-a8su.onrender.com/analyze_ci \
          -H "Content-Type: application/json" \
          -d '{"source": "'"$(cat script.js)"'"}' > result.json

      - name: Read risk score
        run: |
          RISK=$(jq '.risk' result.json)
          echo "Risk score = $RISK"

          if [ "$RISK" -ge 60 ]; then
            echo "❌ BUILD FAILED — High risk detected"
            exit 1
          elif [ "$RISK" -ge 21 ]; then
            echo "⚠️ WARNING — Medium risk detected"
          else
            echo "✅ SAFE TO DEPLOY"
          fi
