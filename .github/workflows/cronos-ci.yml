name: CRONOS Code Guard

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  cronos_analysis:
    runs-on: ubuntu-latest
    name: CRONOS CI Check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed code
        id: diff
        run: |
          echo "Collecting code changes..."

          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff HEAD~1 HEAD > code_changes.txt
          else
            git show HEAD > code_changes.txt
          fi

          echo "===== DIFF PREVIEW ====="
          head -c 500 code_changes.txt
          echo ""
          echo "========================"

      - name: Create CRONOS payload
        run: |
          python3 << 'EOF'
import json

with open("code_changes.txt", "r", errors="ignore") as f:
    new_code = f.read()

if len(new_code) > 50000:
    new_code = new_code[:50000] + "\n\n[TRUNCATED]"

payload = {
    "old_code": "",
    "new_code": new_code,
    "mode": "STRICT"
}

with open("payload.json", "w") as f:
    json.dump(payload, f, indent=2)

print("Payload ready")
EOF

      - name: Send to CRONOS API
        run: |
          curl -X POST https://final-a8su.onrender.com/analyze_ci \
            -H "Content-Type: application/json" \
            -d @payload.json \
            -o response.json

      - name: Show CRONOS result
        run: |
          echo "===== CRONOS RESULT ====="
          cat response.json
          echo "========================="

      - name: Enforce Risk Policy
        run: |
          RISK=$(jq -r '.risk' response.json)

          echo "Risk Score = $RISK"

          if [ "$RISK" -ge 60 ]; then
            echo "❌ BLOCKING DEPLOYMENT"
            exit 1
          else
            echo "✅ SAFE TO DEPLOY"
          fi

      - name: Upload CRONOS report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cronos-report
          path: |
            response.json
            code_changes.txt
            payload.json
